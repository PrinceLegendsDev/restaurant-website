<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Good Vibes Restaurant | Delicious Meals & Online Ordering</title>

    <meta 
        name="description" 
        content="Good Vibes Restaurant offers delicious meals, burgers, chicken, chips and more. Browse our menu and place your order easily online."
    >

    <meta 
        name="keywords" 
        content="Good Vibes Restaurant, restaurant, burgers, chicken, chips, food delivery, online ordering"
    >

    <meta name="author" content="Good Vibes Restaurant">

    <!-- Open Graph for WhatsApp/Facebook sharing -->
    <meta property="og:title" content="Good Vibes Restaurant | Delicious Dining Experience">

    <meta 
        property="og:description" 
        content="Enjoy delicious meals at Good Vibes Restaurant. Explore our menu and order your favourite dishes today."
    >

    <meta property="og:image" content="assets/home.jpg">

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://good-vibes-restaurant.netlify.app">

    <!-- Twitter cards -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="assets/favicon.png">

     <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
    <header id="header">
        
    </header>


     <div class="container">

        <section class="cart-section">

            <h1 class="intro">Your Cart</h1>

            <div class="cart-container">

                <!-- Cart items will be injected here -->

            </div>


            <div class="cart-summary">

                <h2>

            </div>

        </section>

    </div>






    <footer id="footer"></footer>

    <script type="module" src="js/main.js"></script>

</html>
