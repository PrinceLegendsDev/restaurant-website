<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Character Encoding -->
    <meta charset="UTF-8">
    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- SEO -->
    <meta
        name="description"
        content="Experience delicious meals, exceptional service, and a welcoming atmosphere at our restaurant."
    >
    <meta
        name="keywords"
        content="Restaurant, Food, Dining, Menu, Lunch, Dinner, Coffee, Desserts"
    >
    <meta
        name="author"
        content="Prince Legends"
    >
    <!-- Theme Color -->
    <meta
        name="theme-color"
        content="#121212"
    >
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">
    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/style.css">
    <title>Restaurant Website</title>
</head>
<body>
    
    <header id="header">
        
    </header>

    <main>

    <div class="container">

        <section class="home-section">

            <div class="home-content">

                <h1>Welcome To 
                    
                    <strong class="heading">Good Vibes</strong>
                    </h1>

                <p class="description">Where Postive Energy Meets Delicious Dining.</p>

                <div class="home-buttons">

                <a 
                      href="https://wa.me/260XXXXXXXXX?text=Hello%20Good%20Vibes%20Restaurant%20%F0%9F%91%8B%0AI%20would%20like%20to%20place%20an%20order.%20Please%20share%20today%20available%20menu%20and%20prices.%0AThank%20you."
                      class="order-btn btn-primary"
                      target="_blank">
                                Order Now
                </a>

                <a href="menu.html" class="view-btn btn-secondary">View Menu</a>

            </div>

            </div>


            <div class="hero-images">

                <img class="main-image" src="assets/home.jpg"
                         alt="variety of food on the table">

                <div class="support-images">

                    <img src="assets/chips.jpg" alt="chicken and chips image">
                    <img src="assets/burger.jpg" alt="burger image">
                    <img src="assets/burgerChips.jpg" alt="burger and chips on a plate">

                </div>

            </div>

        </section>

    </div>

    </main>





    <footer id="footer"></footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
