<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Good Vibes Restaurant | Delicious Meals & Online Ordering</title>

    <meta 
        name="description" 
        content="Good Vibes Restaurant offers delicious meals, burgers, chicken, chips and more. Browse our menu and place your order easily online."
    >

    <meta 
        name="keywords" 
        content="Good Vibes Restaurant, restaurant, burgers, chicken, chips, food delivery, online ordering"
    >

    <meta name="author" content="Good Vibes Restaurant">

    <!-- Open Graph for WhatsApp/Facebook sharing -->
    <meta property="og:title" content="Good Vibes Restaurant | Delicious Dining Experience">

    <meta 
        property="og:description" 
        content="Enjoy delicious meals at Good Vibes Restaurant. Explore our menu and order your favourite dishes today."
    >

    <meta property="og:image" content="assets/home.jpg">

    <meta property="og:type" content="website">

    <meta property="og:url" content="https://good-vibes-restaurant.netlify.app">

    <!-- Twitter cards -->
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="assets/favicon.png">

     <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    
    <header id="header">
        
    </header>

    <main>

        <div class="container">

            <section contact-section>

                <div class="section-header">

                    <h2>Contact Us</h2>

                    <p>

                        Get in touch with us for reservations
                        and enquiries.

                    </p>

                </div>

                <div class="contact-container">

                    <div class="contact-infor">

                        <div class="contact-item card">

                            <h3>Location</h3>
                            <p>Lusaka, Zambia</p>

                        </div>

                        <div class="contact-item card">

                            <h3>Phone</h3>
                            <p>+260 775 544 529</p>
                            
                        </div>

                        <div class="contact-item card">

                            <h3>Email</h3>
                            <p>infor@goodvibes.com</p>
                            
                        </div>

                    </div>

        

             <form class="contact-form">

            <input 
            type="text" 
            class="input"
            id="name"
            placeholder="eg Prince Legends"
            required>


            <input 
            type="email" 
            class="input"
            id="email"
            placeholder="Enter Your Email"
            required>


            <textarea 
            id="message"
            placeholder="e.g. Hello, I would like to hire you..."
            ></textarea>


           <div class="form-btn">

             <button type="submit" class="btn-primary">
                Send Message
            </button>

           </div>


        </form>


           </div>


            </section>

        </div>

    </main>






    <footer id="footer"></footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
