<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Character Encoding -->
    <meta charset="UTF-8">
    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- SEO -->
    <meta
        name="description"
        content="Experience delicious meals, exceptional service, and a welcoming atmosphere at our restaurant."
    >
    <meta
        name="keywords"
        content="Restaurant, Food, Dining, Menu, Lunch, Dinner, Coffee, Desserts"
    >
    <meta
        name="author"
        content="Prince Legends"
    >
    <!-- Theme Color -->
    <meta
        name="theme-color"
        content="#121212"
    >
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">
    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/style.css">
    <title>Restaurant Website</title>
</head>
<body>
    
    <header id="header">
        
    </header>

    <main>

        <div class="container">

            <section contact-section>

                <div class="section-header">

                    <h2>Contact Us</h2>

                    <p>

                        Get in touch with us for reservations
                        and enquiries.

                    </p>

                </div>

                <div class="contact-container">

                    <div class="contact-infor">

                        <div class="contact-item card">

                            <h3>Location</h3>
                            <p>Lusaka, Zambia</p>

                        </div>

                        <div class="contact-item card">

                            <h3>Phone</h3>
                            <p>+260 775 544 529</p>
                            
                        </div>

                        <div class="contact-item card">

                            <h3>Email</h3>
                            <p>infor@goodvibes.com</p>
                            
                        </div>

                    </div>

        

             <form class="contact-form">

            <input 
            type="text" 
            class="input"
            id="name"
            placeholder="eg Prince Legends"
            required>


            <input 
            type="email" 
            class="input"
            id="email"
            placeholder="Enter Your Email"
            required>


            <textarea 
            id="message"
            placeholder="e.g. Hello, I would like to hire you..."
            ></textarea>


           <div class="form-btn">

             <button type="submit" class="btn-primary">
                Send Message
            </button>

           </div>


        </form>


           </div>


            </section>

        </div>

    </main>






    <footer id="footer"></footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
