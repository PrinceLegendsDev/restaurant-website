<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Character Encoding -->
    <meta charset="UTF-8">
    <!-- Responsive Design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- SEO -->
    <meta
        name="description"
        content="Experience delicious meals, exceptional service, and a welcoming atmosphere at our restaurant."
    >
    <meta
        name="keywords"
        content="Restaurant, Food, Dining, Menu, Lunch, Dinner, Coffee, Desserts"
    >
    <meta
        name="author"
        content="Prince Legends"
    >
    <!-- Theme Color -->
    <meta
        name="theme-color"
        content="#121212"
    >
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico">
    <!-- Google Fonts -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="css/style.css">
    <title>Restaurant Website</title>
</head>
<body>
    
    <header id="header">
        
    </header>

    <h1 class="section-title">TECH LEGENDS</h1>
    <h2 class="section-subtitle">The best programer in the world.</h2>

    <h2>buttons</h2>

    <button class="btn btn-primary">order now</button>

     <button class="btn btn-secondary">order now</button>

     <hr>

     <h2>cards</h2>

     <div class="card">
        <h3>card title</h3>
        <p>card description</p>
     </div>

     <ul class="social-link">
        <li><i class="fa-solid fa-house"></i></li>
         <li><i class="fa-solid fa-bell"></i></li>
     </ul>

     <hr>

     <h2>inputs</h2>

     <input class="input" placeholder="prince legends">

     <hr>

     <h2>badges</h2>

     <span class="badge badge-new">New</span>

     <span class="badge badge-hot">hot</span>


    <div class="image-box">

        <img src="assets/TECHNOVA.png" alt="">

    </div>



    <footer id="footer"></footer>

    <script src="js/main.js" defer></script>
</body>
</html>
